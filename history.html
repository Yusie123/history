<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:#060911;color:#e9edf9;overflow:hidden}
  #app{
    --accent:#34d399;--accent2:#6ee7b7;--glow:rgba(52,211,153,.4);--bg1:rgba(52,211,153,.09);
    height:100dvh;display:flex;flex-direction:column;
    background:
      radial-gradient(760px 480px at 10% -8%,var(--bg1),transparent 62%),

  }
  #app[data-s="wf"]{--accent:#f87171;--accent2:#fca5a5;--glow:rgba(248,113,113,.4);--bg1:rgba(248,113,113,.09)}

  #stats{
    display:flex;gap:12px;align-items:center;padding:6px 14px;
    background:#0d1424;border-bottom:1px solid rgba(255,255,255,.06);
    font-size:11.5px;color:#8b96b4;font-variant-numeric:tabular-nums;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    flex-wrap:wrap;
  }
  #stats .v{color:#a5b4fc;font-weight:700}
  #stats .c{color:#f9a8d4;font-weight:700}
  #stats .r{color:#86efac;font-weight:700}
  #stats button{background:#1e293b;color:#cbd5e1;border:1px solid #334155;
    border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;font-family:inherit}
  #stats button:hover{background:#334155}

  .top{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-shrink:0;
       border-bottom:1px solid rgba(255,255,255,.07);background:#0a0f1c;z-index:30}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;
        background:linear-gradient(135deg,var(--accent),var(--accent2));
        box-shadow:0 0 18px var(--glow);flex-shrink:0}
  .brand h1{font-size:14.5px;margin:0;white-space:nowrap}
  .brand p{margin:1px 0 0;font-size:11px;color:#8b96b4;white-space:nowrap}
  .tabs{display:flex;gap:6px;margin-left:auto;background:rgba(255,255,255,.05);
        padding:4px;border-radius:12px;border:1px solid rgba(255,255,255,.07)}
  .tab{border:0;background:transparent;color:#98a3c0;font:inherit;font-size:12.5px;font-weight:600;
       padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;
       display:flex;align-items:center;gap:6px}
  .tab[aria-selected="true"]{color:#04070f;
       background:linear-gradient(135deg,var(--accent),var(--accent2));
       box-shadow:0 5px 16px -6px var(--glow)}
  .ibtn{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#cfd7ea;
        width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px;
        display:none;place-items:center;flex-shrink:0}
  .body{flex:1;display:flex;min-height:0}
  .side{width:250px;flex-shrink:0;border-right:1px solid rgba(255,255,255,.07);
        overflow-y:auto;padding:12px 10px 40px;background:#080d18;
        scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
  .side::-webkit-scrollbar{width:7px}
  .side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
  .sidehead{display:none}
  .utitle{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:#5f6b8b;
          font-weight:700;margin:14px 8px 6px}
  .topic{width:100%;display:flex;align-items:center;gap:9px;text-align:left;
         border:1px solid transparent;background:transparent;color:#b9c3dc;font:inherit;
         font-size:12.5px;padding:8px 9px;border-radius:9px;cursor:pointer}
  .topic:hover{background:rgba(255,255,255,.055);color:#fff}
  .topic[aria-current="true"]{background:rgba(255,255,255,.09);
         border-color:rgba(255,255,255,.13);color:#fff;font-weight:600}
  .topic .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topic .ct{font-size:10.5px;color:#6b769a;font-variant-numeric:tabular-nums}
  .ring{width:15px;height:15px;border-radius:50%;flex-shrink:0;position:relative}
  .ring::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:#080d18}

  .stage{flex:1;min-width:0;display:flex;flex-direction:column;padding:14px 22px 16px;gap:10px}
  .shead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex-shrink:0}
  .crumb{font-size:12.5px;color:#7c88a8;font-weight:600}
  .crumb b{color:var(--accent2)}
  .pwrap{margin-left:auto;display:flex;align-items:center;gap:9px}
  .ptrack{width:150px;height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
  .pfill{height:100%;width:0;border-radius:99px;
         background:linear-gradient(90deg,var(--accent),var(--accent2));
         transition:width .3s;box-shadow:0 0 10px var(--glow)}
  .ptext{font-size:11.5px;color:#7c88a8;font-variant-numeric:tabular-nums;white-space:nowrap}

  .cardwrap{flex:1;min-height:150px;position:relative}
  .card{position:absolute;inset:0;perspective:1600px;cursor:pointer}
  .cin{position:relative;width:100%;height:100%;transform-style:preserve-3d;
       transition:transform .3s cubic-bezier(.25,.85,.3,1)}
  .card.flip .cin{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
        border-radius:18px;display:flex;overflow-y:auto;
        border:1px solid rgba(255,255,255,.09);
        background:linear-gradient(160deg,#161d32,#0d1221);
        box-shadow:0 22px 50px -28px rgba(0,0,0,.9)}
  .face::-webkit-scrollbar{width:7px}
  .face::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}
  .front{border-top:3px solid var(--accent)}
  .back{transform:rotateY(180deg);border-top:3px solid var(--accent2);
        background:linear-gradient(160deg,#1a2238,#0e1425)}
  .fin{margin:auto;padding:26px 34px;width:100%;text-align:center}
  .badge{display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;
         font-weight:800;color:var(--accent2);background:rgba(255,255,255,.06);
         padding:4px 11px;border-radius:99px;margin-bottom:16px}
  .q{font-size:clamp(16px,1.9vw,23px);line-height:1.45;font-weight:600;margin:0}
  .a{font-size:clamp(13px,1.25vw,16.5px);line-height:1.75;margin:0;color:#dbe3f7;text-align:left}
  .a strong,.q strong{color:var(--accent2);font-weight:700}
  .hint{display:block;margin-top:20px;font-size:11px;color:#5d688a}
  kbd{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);
      border-radius:4px;padding:1px 5px;font-size:10px;font-family:inherit}

  .row{display:flex;gap:8px;flex-shrink:0}
  .btn{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#dbe3f7;
       font:inherit;font-size:13px;font-weight:600;padding:11px 16px;border-radius:11px;
       cursor:pointer;flex:1;transition:background .12s,color .12s,border-color .12s}
  .btn:hover{background:rgba(255,255,255,.1)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#05080f;
       border-color:transparent;box-shadow:0 8px 20px -10px var(--glow)}
  .mark.rev{border-color:rgba(244,114,182,.3);color:#f9a8d4}
  .mark.got{border-color:rgba(34,197,94,.3);color:#86efac}
  .mark.got.on{background:#22c55e !important;color:#04240e !important;border-color:#22c55e !important;
       box-shadow:0 0 22px -3px rgba(34,197,94,.85) !important;font-weight:800 !important}
  .mark.rev.on{background:#f472b6 !important;color:#3a0a24 !important;border-color:#f472b6 !important;
       box-shadow:0 0 22px -3px rgba(244,114,182,.85) !important;font-weight:800 !important}

  .bar{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .cnt{font-size:11.5px;color:#7c88a8;font-variant-numeric:tabular-nums;margin-right:auto}
  .tiny{flex:0 0 auto;padding:7px 12px;font-size:11.5px;border-radius:9px}
  .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
         color:#7c88a8;border:1px dashed rgba(255,255,255,.14);border-radius:18px;padding:30px}
  .empty h3{margin:0 0 6px;color:#cfd7ea;font-size:17px}
  .empty p{margin:0;font-size:13px;line-height:1.6}
  .bd{display:none}
  @media(max-width:880px){
    .brand p{display:none}
    .ibtn{display:grid}
    .top{flex-wrap:wrap;gap:8px;padding:10px 12px}
    .tabs{order:3;width:100%;margin-left:0;overflow-x:auto}
    .tab{flex:1;justify-content:center;padding:7px 8px;font-size:11.5px}
    .side{position:fixed;top:0;left:0;bottom:0;z-index:60;width:280px;background:#0a0f1c;
          transform:translateX(-102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);
          box-shadow:24px 0 50px -18px rgba(0,0,0,.9)}
    .side.open{transform:none}
    .sidehead{display:flex;align-items:center;justify-content:space-between;
              padding:0 4px 8px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.08)}
    .sidehead h2{font-size:13.5px;margin:8px 0}
    .sidehead .ibtn{display:grid;width:32px;height:32px}
    .bd{display:block;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:55;
        opacity:0;pointer-events:none;transition:opacity .22s}
    .bd.on{opacity:1;pointer-events:auto}
    .stage{padding:12px}
    .fin{padding:20px 18px}
  }
</style>
</head>

  <div id="stats">

</div>

<script>
/* =========================================================
   DATA
   ========================================================= */
var SECTIONS = [
{ id:"med", title:"Medicine in Britain", emoji:"🩺", units:[
  { name:"Medieval Medicine c1250–c1500", groups:[
    { name:"Causes of Disease", cards:[
      ["What was the Theory of the Four Humours?","The belief the body contained **four fluids** — **blood, phlegm, yellow bile, black bile**. Illness was caused by an **imbalance** of these humours."],
      ["Who developed the Theory of the Four Humours?","**Hippocrates** (c460–c370 BC), a Greek physician, first developed it. **Galen** (c129–c216 AD) later developed it further."],
      ["What was the miasma theory?","The belief that disease was caused by **bad air** — foul smells from rotting matter, sewage, and swamps were thought to carry illness."],
      ["What was the supernatural explanation for disease?","The belief that disease was a **punishment from God** for sin, or caused by **evil spirits**, **astrology**, or **witchcraft**."],
      ["Why did the Church support the Four Humours theory?","Because it **fit with the Christian idea** that God created a balanced universe — the Church preserved Galen's works and **banned dissection**."],
      ["What did people believe caused the Black Death?","Most believed it was **God's punishment**, or that it came from **miasma** — some blamed **Jews** or **astrology**."]
    ]},
    { name:"Treatments and Prevention", cards:[
      ["What was bloodletting?","Removing blood to **balance the humours** — done by **cupping**, **leeching**, or **cutting a vein**."],
      ["What was purging?","Using **herbs or laxatives** to cleanse the body of excess humours — often caused vomiting or diarrhoea."],
      ["What was the Theory of Opposites?","Treating an illness with its **opposite** — e.g. a fever (hot) was treated with **cold baths**."],
      ["What were common herbal remedies?","**Theriaca**, **mithridatum**, **opium** for pain, and **willow bark** for fever."],
      ["What was the 'Regimen Sanitatis'?","A **set of rules for healthy living** — diet, exercise, sleep, and cleanliness — based on the Four Humours."],
      ["How did people try to prevent the Black Death?","They **prayed**, **fasted**, went on **pilgrimages**, **burned herbs** for clean air, and **isolated the sick**."],
      ["What was the role of the barber surgeon?","A **craftsman who cut hair AND performed minor surgery** — tooth extraction, bloodletting, and setting broken bones."],
      ["What was the role of the physician?","A **university-trained doctor** who diagnosed illness and prescribed treatments — but **did not perform surgery**."]
    ]},
    { name:"Surgery", cards:[
      ["What was the main problem with medieval surgery?","There was **no anaesthetic**, so surgery was **extremely painful** — patients had to be held down."],
      ["What was cauterisation?","**Burning a wound with a hot iron** to seal it and stop bleeding — very painful and could cause infection."],
      ["Why was medieval surgery so dangerous?","Because surgeons **didn't understand infection or germs** — they used dirty instruments."],
      ["What was the impact of the Church on surgery?","The Church **banned dissection** of human bodies, so surgeons had **very limited knowledge of anatomy**."],
      ["How did surgeons learn about anatomy?","From **Galen's books** — but Galen had dissected **animals**, not humans, so some of his ideas were wrong."],
      ["What was the survival rate of medieval surgery?","Very low — most patients died from **infection, blood loss, or shock**."]
    ]},
    { name:"Public Health", cards:[
      ["What was public health like in medieval towns?","Very poor — **no sewers**, **rubbish in the streets**, and **shared water sources** that were often contaminated."],
      ["What public health measures did monasteries have?","Monasteries had **clean water pipes**, **latrines**, and **bath houses** — much cleaner than towns."],
      ["How did towns try to clean up?","Some towns passed **local laws** to remove rubbish and **banned animals** from the streets — but enforcement was weak."],
      ["What was the government's role in public health?","Almost none — the **king and government did nothing**. It was left to **local communities**."],
      ["How did people respond to the Black Death in 1348?","They **quarantined the sick**, **closed public places**, and **burned infected items** — but they didn't understand the cause."],
      ["Why was medieval public health so poor?","Because of **limited scientific knowledge**, **no government action**, and **poverty**."]
    ]},
    { name:"Key Individuals & Medical Knowledge", cards:[
      ["Who was Hippocrates?","A **Greek physician** (c460–c370 BC) — developed the **Four Humours** and the **Hippocratic Oath**."],
      ["Who was Galen?","A **Roman physician** (c129–c216 AD) — developed the **Four Humours** and the **Theory of Opposites**; his books were used for over **1000 years**."],
      ["Who was Avicenna?","A **Persian physician** (980–1037) who wrote **The Canon of Medicine** — used in European universities."],
      ["How was Galen's work preserved?","The **Church** copied and preserved his books in monasteries — they became the **standard medical texts**."],
      ["Why did Galen's ideas survive so long?","Because the **Church supported them** — they fit with the idea of a **balanced, God-created universe**."],
      ["What was taught in medieval universities?","Medicine was taught from **Galen's and Hippocrates' books** — students learned by **reading**, not **dissecting**."]
    ]}
  ]},
  { name:"Renaissance Medicine c1500–c1700", groups:[
    { name:"Causes of Disease", cards:[
      ["Did the Four Humours theory survive into the Renaissance?","Yes — the Four Humours was **still widely believed** in 1500, though it gradually began to be questioned."],
      ["What was the miasma theory in the Renaissance?","**Still dominant** — people continued to believe disease was caused by **bad air**."],
      ["Who challenged the Four Humours in the Renaissance?","**Paracelsus** (1493–1541) argued that disease was caused by **chemical imbalances** in the body."],
      ["Who was Van Helmont?","A **Flemish physician** (1580–1644) who believed disease was caused by **chemical and biological agents**."],
      ["What was the 'spontaneous generation' theory?","The belief that **living organisms came from non-living matter** — disproved by **Pasteur** in 1861."]
    ]},
    { name:"Treatments and Prevention", cards:[
      ["What new treatments appeared in the Renaissance?","**Chemical remedies** (Paracelsus) and **quinine** (from Peru) for malaria — a breakthrough treatment."],
      ["Who was Thomas Sydenham?","An **English physician** (1624–1689) — emphasised **careful observation and diagnosis**, the **'English Hippocrates'**."],
      ["What was the 'royal touch'?","A practice where the **king touched sufferers of scrofula** to cure them — a **supernatural** remedy."],
      ["What was transference?","A **supernatural cure** where illness was transferred to an object or animal."],
      ["Did bloodletting continue in the Renaissance?","**Yes** — bloodletting and purging remained the main treatments."],
      ["What was the impact of the printing press?","The **printing press** (c1440) allowed **medical books to be printed and shared** — **accelerating the exchange of ideas**."]
    ]},
    { name:"Surgery", cards:[
      ["Who was Andreas Vesalius?","A **Flemish anatomist** (1514–1564) — wrote **On the Fabric of the Human Body** (1543), **correcting Galen's mistakes**."],
      ["How did Vesalius improve anatomy?","He **dissected human bodies** and proved some of Galen's ideas were **wrong** — e.g. the jawbone is one bone, not two."],
      ["Who was Ambroise Paré?","A **French surgeon** (1510–1590) — **abandoned cauterisation** and used **ligatures** to stop bleeding."],
      ["What was Paré's 'ointment'?","A **soothing ointment** made of egg yolk, oil of roses, and turpentine — used instead of **boiling oil**."],
      ["Who was William Harvey?","An **English physician** (1578–1657) — discovered that **blood circulates around the body**, pumped by the **heart**."],
      ["What did Harvey prove about the heart?","That the **heart pumps blood** around the body in a **one-way system** — not that the liver produces blood, as Galen claimed."],
      ["Did surgery improve in the Renaissance?","**Only slightly** — Paré's ligatures helped, but there was still **no anaesthetic** and **no understanding of infection**."]
    ]},
    { name:"Public Health", cards:[
      ["What was the Great Plague of 1665?","The **last major outbreak of plague** in England — around **100,000 people died**."],
      ["How did the government respond to the Great Plague?","They issued **plague orders** — **quarantining infected households**, **killing cats and dogs**, and **closing public places**."],
      ["Did public health improve in the Renaissance?","**Very little** — towns were still dirty, water was still contaminated, and there was **no national public health system**."],
      ["What were 'pest houses'?","Buildings where **plague victims were isolated** — a form of **public health measure**."],
      ["What was the impact of the Great Fire of London (1666)?","It **destroyed much of the city**, but also **killed the rats and fleas** that spread the plague."],
      ["Did the government build sewers in the Renaissance?","**No** — proper sewers were not built until the **19th century** (Bazalgette, 1858–1875)."]
    ]},
    { name:"Key Individuals & Medical Knowledge", cards:[
      ["What was the impact of Vesalius?","He **corrected Galen's errors** — but his work was **slow to be accepted**."],
      ["What was the impact of Paré?","He **improved surgical techniques** (ligatures, ointments) — but surgery was still **limited**."],
      ["What was the impact of Harvey?","He **proved blood circulates** — a **major step forward**, but slow to be accepted."],
      ["What was the Royal Society?","A **scientific society** founded in **1660** — encouraged **experiment, observation, and the sharing of ideas**."],
      ["Why was change slow in the Renaissance?","Because of **continued belief in Galen**, **the Church's influence**, **lack of scientific method**, and **no government support**."],
      ["What was the 'scientific revolution'?","A period of **major change in thinking** (c1550–c1700) — people began to **question old ideas** and rely on **observation and experiment**."]
    ]}
  ]},
  { name:"18th & 19th Century Medicine c1700–c1900", groups:[
    { name:"Causes of Disease", cards:[
      ["Who was Edward Jenner?","An **English doctor** (1749–1823) — in **1796** he discovered that **cowpox protected against smallpox**, developing the **first vaccine**."],
      ["Who was Louis Pasteur?","A **French chemist** (1822–1895) — in **1861** he developed the **Germ Theory**, proving that **microbes in the air caused disease**."],
      ["Who was Robert Koch?","A **German doctor** (1843–1910) — identified the **specific bacteria** that caused **TB (1882), cholera (1883), and anthrax (1876)**."],
      ["What was the 'Germ Theory'?","The theory that **microbes (germs) cause disease** — developed by **Pasteur** in 1861."],
      ["What did John Snow discover?","In **1854** he traced a **cholera outbreak in London** to a **water pump on Broad Street** — proving cholera was **waterborne**."],
      ["What was the 'spontaneous generation' theory?","The belief that **living organisms came from non-living matter** — **Pasteur disproved this** in 1861."],
      ["What was the 'miasma' theory and when did it decline?","The belief that **bad air caused disease** — it declined in the **1860s–1870s** as the **Germ Theory** became accepted."]

function rich(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");}

function saveData(){
  if(!storageOK) return;
  try{
    window.localStorage.setItem(STORE, JSON.stringify({
      s: STATUS, sec: S.sec, filter: S.filter,
      shuffled: S.shuffled, i: S.i
    }));
  }catch(e){}
}
function loadData(){
  if(!storageOK) return;
  try{
    var raw = window.localStorage.getItem(STORE);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(!d) return;
    if(d.s && typeof d.s === "object") STATUS = d.s;
    if(d.sec && SEC[d.sec]) S.sec = d.sec;
    if(d.filter === "all" || d.filter === "review" || (GROUP_INDICES[S.sec] && GROUP_INDICES[S.sec][d.filter])){
      S.filter = d.filter;

    if(typeof d.shuffled === "boolean") S.shuffled = d.shuffled;
    if(typeof d.i === "number" && d.i >= 0) S.i = d.i;
  }catch(e){}
}

  var known = countKnown(sectionIdx);
  var review = countReview(sectionIdx);

  document.getElementById("statClicks").textContent = S.clicks;
  document.getElementById("statKnown").textContent = known;
  document.getElementById("statReview").textContent = review;
  document.getElementById("statDeck").textContent = S.deck.length;
  document.getElementById("statIndex").textContent = S.deck.length ? (S.i + 1) : 0;

  var curAbs = S.deck.length ? S.deck[S.i] : null;
  document.getElementById("statCard").textContent =
    (curAbs === null || curAbs === undefined) ? "-" : ("# " + curAbs);
  document.getElementById("statState").textContent =
    (curAbs === null || curAbs === undefined) ? "-" : (STATUS[curAbs] || "unmarked");
}

/* =========================================================
   SIDEBAR
   ========================================================= */
function rebuildSidebar(){
  var container = document.getElementById("topics");
  container.innerHTML = "";

  container.appendChild(makeSidebarBtn("All topics", "all", true));
  container.appendChild(makeSidebarBtn("Review pile", "review", true));

  var lastUnit = null;
  for(var i = 0; i < GROUP_META[S.sec].length; i++){
    var gi = GROUP_META[S.sec][i];
    if(gi.unitName !== lastUnit){
      var h = document.createElement("div");
      h.className = "utitle";
      h.textContent = gi.unitName;
      container.appendChild(h);
      lastUnit = gi.unitName;
    }
    container.appendChild(makeSidebarBtn(gi.name, gi.key, false));
  }

  var all = container.querySelectorAll("[data-f]");
  for(var j = 0; j < all.length; j++){
    if(all[j].getAttribute("data-f") === S.filter){
      all[j].setAttribute("aria-current","true");
    }
  }
}

function makeSidebarBtn(label, filterKey, special){
  var indices = indicesFor(filterKey);
  var kCount = countKnown(indices);
  var rCount = countReview(indices);
  var total = indices.length;
  var pct = total ? (kCount / total * 100) : 0;
  var col = (filterKey === "review") ? "#f472b6" : "var(--accent)";

  var b = document.createElement("button");
  b.className = "topic" + (special ? " special" : "");
  b.type = "button";
  b.setAttribute("data-f", filterKey);

  var ring = document.createElement("span");
  ring.className = "ring";
  ring.style.background = "conic-gradient(" + col + " " + pct + "%, rgba(255,255,255,.12) 0)";

  var nm = document.createElement("span");
  nm.className = "nm";
  nm.textContent = label;

  var ct = document.createElement("span");
  ct.className = "ct";
  ct.textContent = (filterKey === "review") ? String(rCount) : (kCount + "/" + total);

  b.appendChild(ring); b.appendChild(nm); b.appendChild(ct);

  b.onclick = function(){
    S.filter = filterKey;
    S.i = 0;
    S.flipped = false;
    document.getElementById("card").classList.remove("flip");
    buildDeck();
    rebuildSidebar();
    renderCard();
    refreshStats();
    saveData();
    closeDrawer();
  };

  return b;
}

/* =========================================================
   DECK
   ========================================================= */
function buildDeck(){
  var list = indicesFor(S.filter);
  if(S.shuffled){
    for(var i = list.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = list[i]; list[i] = list[j]; list[j] = t;
    }
  }
  S.deck = list;
  if(S.i >= list.length) S.i = Math.max(0, list.length - 1);
  if(S.i < 0) S.i = 0;
}

/* =========================================================
   RENDER CARD
   ========================================================= */
var lastShownAbs = null;

function renderCard(){
  var deck = S.deck;
  var cardEl = document.getElementById("card");
  var existing = document.querySelector(".empty");

  if(deck.length === 0){
    cardEl.style.display = "none";
    if(!existing){
      var e = document.createElement("div");
      e.className = "empty";
      e.innerHTML = S.filter === "review"
        ? "<div><h3>Review pile is empty</h3><p>Hit <b>Need review</b> on any card to add it here.</p></div>"
        : "<div><h3>No cards here</h3><p>Pick another topic from the sidebar.</p></div>";
      document.getElementById("cardwrap").appendChild(e);
    }
    document.getElementById("cnt").textContent = "0 / 0";
    document.getElementById("pfill").style.width = "0%";
    document.getElementById("ptext").textContent = "0 / 0";
    return;
  }
  if(existing) existing.remove();
  cardEl.style.display = "";

  var abs = deck[S.i];
  var c = ALL_CARDS[abs];

  if(abs !== lastShownAbs){
    document.getElementById("qt").innerHTML = c.qHtml;
    document.getElementById("at").innerHTML = c.aHtml;
    document.getElementById("bf").textContent = c.grp;
    document.getElementById("bb").textContent = c.grp + " · Answer";
    lastShownAbs = abs;
  }

  document.getElementById("cnt").textContent = (S.i + 1) + " / " + deck.length;

  var st = STATUS[abs];
  document.getElementById("revBtn").className = "btn mark rev" + (st === "review" ? " on" : "");
  document.getElementById("gotBtn").className = "btn mark got" + (st === "known" ? " on" : "");

  var k = countKnown(deck);
  var pct = deck.length ? (k / deck.length * 100) : 0;
  document.getElementById("pfill").style.width = pct + "%";
  document.getElementById("ptext").textContent = k + " / " + deck.length;

  var sec = SEC[S.sec];
  var label = S.filter === "all" ? "All topics"
            : S.filter === "review" ? "Review pile"
            : (function(){
                for(var i = 0; i < GROUP_META[S.sec].length; i++){
                  if(GROUP_META[S.sec][i].key === S.filter) return GROUP_META[S.sec][i].name;
                }
                return S.filter;
              })();
  document.getElementById("crumb").innerHTML = sec.emoji + " <b>" + sec.title + "</b> · " + esc(label);
}

/* =========================================================
   ACTIONS
   ========================================================= */
function markKnown(){
  S.clicks++;
  var abs = S.deck[S.i];
  if(abs === undefined){ refreshStats(); return; }
  if(STATUS[abs] === "known") delete STATUS[abs];
  else STATUS[abs] = "known";
  saveData();
  rebuildSidebar();
  renderCard();
  refreshStats();
}

function markReview(){
  S.clicks++;
  var abs = S.deck[S.i];
  if(abs === undefined){ refreshStats(); return; }
  if(STATUS[abs] === "review") delete STATUS[abs];
  else STATUS[abs] = "review";
  saveData();
  if(S.filter === "review" && STATUS[abs] !== "review"){
    buildDeck();
  }
  rebuildSidebar();
  renderCard();
  refreshStats();
}

function goNext(){
  var n = S.deck.length;
  if(!n) return;
  S.flipped = false;
  document.getElementById("card").classList.remove("flip");
  S.i = (S.i + 1) % n;
  saveData();
  renderCard();
  refreshStats();
}
function goPrev(){
  var n = S.deck.length;
  if(!n) return;
  S.flipped = false;
  document.getElementById("card").classList.remove("flip");
  S.i = (S.i - 1 + n) % n;
  saveData();
  renderCard();
  refreshStats();
}
function flipCard(){
  S.flipped = !S.flipped;
  document.getElementById("card").classList.toggle("flip", S.flipped);
}

/* =========================================================
   TABS
   ========================================================= */
function buildTabs(){
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  SECTIONS.forEach(function(sec){
    var b = document.createElement("button");
    b.className = "tab";
    b.type = "button";
    b.setAttribute("data-sec", sec.id);
    b.innerHTML = "<span>" + sec.emoji + "</span><span>" + sec.title + "</span>";
    b.onclick = function(){
      if(S.sec === sec.id) return;
      S.sec = sec.id;
      S.filter = "all";
      S.i = 0;
      S.shuffled = false;
      S.flipped = false;
      lastShownAbs = null;
      document.getElementById("card").classList.remove("flip");
      document.getElementById("app").setAttribute("data-s", sec.id);
      document.getElementById("logo").textContent = sec.emoji;
      buildDeck();
      rebuildSidebar();
      paintTabs();
      renderCard();
      refreshStats();
      saveData();
    };
    tabs.appendChild(b);
  });
}
function paintTabs(){
  var kids = document.getElementById("tabs").children;
  for(var i = 0; i < kids.length; i++){
    kids[i].setAttribute("aria-selected", kids[i].getAttribute("data-sec") === S.sec ? "true" : "false");
  }
}

/* =========================================================
   DRAWER
   ========================================================= */
function openDrawer(){
  document.getElementById("side").classList.add("open");
  document.getElementById("bd").classList.add("on");
}
function closeDrawer(){
  document.getElementById("side").classList.remove("open");
  document.getElementById("bd").classList.remove("on");
}

/* =========================================================
   WIRE UP
   ========================================================= */
function wire(){
  document.getElementById("gotBtn").onclick = markKnown;
  document.getElementById("revBtn").onclick = markReview;
  document.getElementById("next").onclick = goNext;
  document.getElementById("prev").onclick = goPrev;
  document.getElementById("flip").onclick = flipCard;
  document.getElementById("card").onclick = flipCard;

  document.getElementById("shuf").onclick = function(){
    S.shuffled = !S.shuffled;
    document.getElementById("shuf").textContent = S.shuffled ? "Shuffled ✓" : "Shuffle";
    S.i = 0;
    S.flipped = false;
    document.getElementById("card").classList.remove("flip");
    buildDeck();
    renderCard();
    refreshStats();
    saveData();
  };

  /* Reset — two-tap, no browser dialog, visible feedback */
  (function(){
    var resetEl = document.getElementById("reset");
    var armedAt = 0;
    var labelTimer = 0;

    function flash(msg, bg, border, colour, ms){
      clearTimeout(labelTimer);
      resetEl.textContent = msg;
      resetEl.style.background = bg;
      resetEl.style.borderColor = border;
      resetEl.style.color = colour;
      labelTimer = setTimeout(function(){
        resetEl.textContent = "↺ Reset";
        resetEl.style.background = "";
        resetEl.style.borderColor = "";
        resetEl.style.color = "";
      }, ms || 1500);
    }

    resetEl.addEventListener("click", function(e){
      e.preventDefault();
      e.stopPropagation();

      var now = Date.now();

      if(now - armedAt < 3000){
        armedAt = 0;
        STATUS = {};
        S.i = 0;
        saveData();
        buildDeck();
        rebuildSidebar();
        renderCard();
        refreshStats();
        flash("✓ Reset!", "rgba(34,197,94,.25)", "#22c55e", "#86efac", 1200);
      } else {
        armedAt = now;
        flash("Tap again to confirm", "rgba(244,114,182,.2)", "#f472b6", "#f9a8d4", 3000);
      }
    });
  })();

  document.getElementById("clearData").onclick = function(){
    if(!window.confirm("Clear ALL saved data and reload?")) return;
    try { window.localStorage.removeItem(STORE); } catch(e){}
    location.reload();
  };

  document.getElementById("menuBtn").onclick = openDrawer;
  document.getElementById("closeBtn").onclick = closeDrawer;
  document.getElementById("bd").onclick = closeDrawer;

  document.addEventListener("keydown", function(e){
    var tag = e.target.tagName;
    if(tag === "INPUT" || tag === "TEXTAREA") return;
    if(e.key === " " || e.key === "Enter"){
      if(tag === "BUTTON") return;
      e.preventDefault(); flipCard();
    } else if(e.key === "ArrowRight" || e.key === "ArrowDown"){
      e.preventDefault(); goNext();
    } else if(e.key === "ArrowLeft" || e.key === "ArrowUp"){
      e.preventDefault(); goPrev();
    } else if(e.key === "1"){ e.preventDefault(); markReview(); }
      else if(e.key === "2"){ e.preventDefault(); markKnown(); }
      else if(e.key === "Escape"){ closeDrawer(); }
  });

  var tx = 0, ty = 0, tracking = false;
  document.getElementById("cardwrap").addEventListener("touchstart", function(e){
    if(e.touches.length !== 1) return;
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
    tracking = true;
  }, {passive:true});
  document.getElementById("cardwrap").addEventListener("touchend", function(e){
    if(!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - tx;
    var dy = t.clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)){
      if(dx < 0) goNext(); else goPrev();
    }
  }, {passive:true});
}

/* =========================================================
   BOOT
   ========================================================= */
loadData();
document.getElementById("app").setAttribute("data-s", S.sec);
document.getElementById("logo").textContent = SEC[S.sec].emoji;
buildTabs();
paintTabs();
buildDeck();
rebuildSidebar();
wire();
renderCard();
refreshStats();
</script>
</body>
</html>
